<header id="title-block-header">
<h1 class="title">混沌流控制</h1>
</header>
<h2 id="控制">控制</h2>
<p>点击设置齿轮图标，可调整颜色方案和调试参数。</p>
<p>点击示例名称，可切换不同的向量场。</p>
<p>工具栏包含以下按钮：</p>
<ul>
<li><p>清除流场中的所有粒子。</p></li>
<li><p>选择要添加的下一个粒子的颜色。</p></li>
<li><p>选择在主窗口中点击时添加单个粒子、粒子流还是粒子网格。</p></li>
<li><p>启动或暂停流动模拟。</p></li>
<li><p>调节流动速度。</p></li>
</ul>
<p>有两个复选框分别用于控制是否绘制等斜线（“Iso”）以及是否绘制向量场（“Fld”）。</p>
<p>窗口中央显示当前的流场动态。</p>
